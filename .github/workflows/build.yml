name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller

      - run: pyinstaller --onefile --windowed --name JoyeuseFlasher flasher.py

      - uses: actions/upload-artifact@v4
        with:
          name: JoyeuseFlasher
          path: dist/JoyeuseFlasher.exe
